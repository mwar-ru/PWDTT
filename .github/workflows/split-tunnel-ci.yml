name: Split Tunneling CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-linux-race-and-cross:
    name: Go (-race + Windows cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run split-tunnel tests with race detector
        run: go test -race -v ./internal/splittunnel/...
      - name: Cross-compile Windows split-tunnel packages & tests
        run: |
          GOOS=windows GOARCH=amd64 go test -c -o /dev/null ./internal/splittunnel/...
          GOOS=windows GOARCH=amd64 go build ./backend/...
      - name: Run upstream backend tests
        run: go test ./tests/...

  go-windows-abi:
    name: Go Windows ABI & IP Helper Live Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run Windows live unit & ABI tests
        run: go test -v ./internal/splittunnel/...

  frontend:
    name: Frontend (Vitest + Production Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
