name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Draft Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Frontend install & test
        working-directory: frontend
        run: |
          npm ci
          npm run test
      - name: Run Go tests
        run: go test ./backend/... ./internal/splittunnel/...
      - name: Build mwPWDTT_windows.exe
        run: wails build -platform windows/amd64 -s
      - name: Download & verify WinDivert 2.2.2-A
        shell: pwsh
        run: |
          $wdZip = "$env:RUNNER_TEMP\WinDivert-2.2.2-A.zip"
          $wdDir = "$env:RUNNER_TEMP\windivert"
          try {
            Invoke-WebRequest -Uri "https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip" -OutFile $wdZip -UseBasicParsing
          } catch {
            Invoke-WebRequest -Uri "https://reqrypt.org/download/WinDivert-2.2.2-A.zip" -OutFile $wdZip -UseBasicParsing
          }
          Expand-Archive -Path $wdZip -DestinationPath $wdDir -Force
          $dll = (Get-ChildItem $wdDir -Recurse -Filter "WinDivert.dll" | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1).FullName
          $sys = (Get-ChildItem $wdDir -Recurse -Filter "WinDivert64.sys" | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1).FullName
          Copy-Item $dll ".\third_party\windivert\WinDivert.dll" -Force
          Copy-Item $sys ".\third_party\windivert\WinDivert64.sys" -Force
          foreach ($line in Get-Content ".\third_party\windivert\CHECKSUMS.sha256") {
            if ($line -match '^([0-9a-fA-F]{64})\s+(.+)$') {
              $want = $Matches[1].ToLower()
              $file = Join-Path ".\third_party\windivert" $Matches[2].Trim()
              $got = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
              if ($got -ne $want) { throw "WinDivert checksum mismatch: $file ($got != $want)" }
              Write-Host "Verified $file"
            }
          }
      - name: Package release zip & SHA256SUMS.txt
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $outDir = "release-out"
          $stage = "$outDir\_stage"
          $zipName = "mwPWDTT_windows-amd64-$tag.zip"
          $zipPath = "$outDir\$zipName"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item ".\build\bin\mwPWDTT_windows.exe" $stage
          Copy-Item ".\third_party\windivert\WinDivert.dll" $stage
          Copy-Item ".\third_party\windivert\WinDivert64.sys" $stage
          Copy-Item ".\third_party\windivert\CHECKSUMS.sha256" $stage
          Copy-Item ".\docs\MANUAL.md" $stage
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLower()
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) "$outDir\SHA256SUMS.txt"), "$hash  $zipName`n", [System.Text.UTF8Encoding]::new($false))
          Get-Content "$outDir\SHA256SUMS.txt"
      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-out/mwPWDTT_windows-amd64-${{ github.ref_name }}.zip
            release-out/SHA256SUMS.txt
